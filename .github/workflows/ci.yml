name: ci

on:
  push:
  pull_request:

permissions: {}

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      # Covers the Archipelago logic block inside public/game.js, which has to
      # stay in step with stick_ranger/rules.py in the apworld repo.
      - run: npm test

      - run: npm run build
