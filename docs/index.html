<!DOCTYPE html>
<html>
    <head>
        <title>Archipelago - Stick Ranger</title>
        <style>@font-face{font-family:dan-ball;src:url(/assets/dan-ball-6ABAm9zV.otf)format("opentype");unicode-range:U+20-27,U+2A-7D,U+A5;size-adjust:60%}@font-face{font-family:dan-ball;src:local("monospace")}#cv:-webkit-full-screen{image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor;object-fit:contain;background-color:#000;width:100%;height:100%;position:fixed}body{background-color:#0f0f0f;display:flex;overflow:hidden}body.font-danball pre{letter-spacing:.5px;font-family:dan-ball,monospace;font-size:.9em}html,body{height:100%;margin:0}#left-panel{float:left;display:none}#right-panel{float:right;color:#fff;resize:both;background-color:#333;border-radius:10px;flex-direction:column;align-items:center;width:100%;margin:10px;display:flex;overflow:auto}#saveCode{width:512px}#APConnection{flex-direction:column;align-items:center;display:flex}#connect{cursor:pointer}#chat{box-sizing:border-box;border:2px solid #4c4c4c;border-radius:10px;flex-direction:column;flex:1;width:100%;display:flex;overflow:hidden}#connectionBox{background-color:#4c4c4c;justify-content:space-between;align-items:center;padding:2px;display:none;position:sticky;top:0}#connectionInfo{float:left}#disconnect{float:right;color:#fff;background-color:#4c4c4c;border:none;border-left:2px solid #5b5b5b}#disconnect:hover{color:#ff5050;cursor:pointer}#chatMessages{color:#fff;flex-grow:1;padding:4px;overflow-y:auto}#chatLine{background-color:#4c4c4c;justify-content:space-between;align-items:center;padding:4px;display:none}#message{float:left;width:90%}#message:focus{box-shadow:none;outline:none}#send{float:right;color:#fff;background-color:#4c4c4c;border:none;border-left:2px solid #5b5b5b}#send:hover{color:#ff5050;cursor:pointer}.switch{width:34px;height:20px;display:inline-block;position:relative}.switch input{opacity:0;width:0;height:0}.slider{cursor:pointer;background-color:#ccc;border-radius:20px;transition:all .2s;position:absolute;inset:0}.slider:before{content:"";background-color:#fff;border-radius:50%;width:14px;height:14px;transition:all .2s;position:absolute;bottom:3px;left:3px}input:checked+.slider{background-color:#2196f3}input:checked+.slider:before{transform:translate(14px)}#fontSwitch{color:#fff;font-family:dan-ball}</style>
      <script type="module" crossorigin src="/assets/index-BELk4wb0.js"></script>
    </head>

    <body id="body">
        <div id="left-panel">
            <canvas id="cv"></canvas>
            <script src="/game.js"></script>
            <script type="text/javascript">
                Init("1", 1, 0);
            </script>
            <div id="saveCode" style="width: 512px">
                <script type="text/javascript">
                    function saveCode() {
                        var save_html = "";
                        save_html += '<table class="ctbl"><tr><td><textarea id="inputBox" rows="1" cols="48" onclick="this.select();"><\/textarea><\/td>';
                        save_html += '<td><input type="submit" value="Get" onclick="getCode()" onmousedown="document.getElementById(\'inputBox\').value=\'\';">';
                        save_html += '<input type="submit" value="Set" onclick="load()";><\/td><\/tr><br>';

                        document.getElementById("saveCode").innerHTML = save_html;
                    }
                    saveCode();
                </script>
                <script type="text/javascript">
                    function getCode() {
                        var save_string = GameSave("0");

                        if (save_string != "") document.getElementById("inputBox").value = save_string;
                    }

                    function load() {
                        document.getElementById("inputBox").value = document.getElementById("inputBox").value.replace(/\x0D\x0A|\x0D|\x0A/g, "");
                        var save_string = document.getElementById("inputBox").value;

                        if (save_string != "") GameLoad(save_string);
                    }
                </script>
            </div>
            <div id="fullScreenButton">
                <input type="submit" value="Full Screen" onclick="fullScreen();" />
                <label class="switch">
                    <input type="checkbox" id="fontToggle" checked />
                    <span class="slider round"></span>
                </label>

                <span id="fontSwitch">Dan-ball font</span>
            </div>
        </div>

        <div id="right-panel">
            <div id="APConnection">
                <p>Archipelago connection</p>
                <table>
                    <tr>
                        <td>Host:</td>
                        <td><input type="text" id="host" placeholder="archipelago.gg" value="archipelago.gg" /></td>
                    </tr>
                    <tr>
                        <td>Port:</td>
                        <td><input type="text" id="port" placeholder="35556" /></td>
                    </tr>
                    <tr>
                        <td>Slot name:</td>
                        <td><input type="text" id="slotName" placeholder="Slot name" /></td>
                    </tr>
                    <tr>
                        <td>Password:</td>
                        <td><input type="password" id="password" /></td>
                    </tr>
                </table>
                <button id="connect">Connect</button>
            </div>
            <div id="chat">
                <div id="connectionBox">
                    <span id="connectionInfo"></span>
                    <button id="disconnect">Disconnect</button>
                </div>
                <div id="chatMessages"></div>
                <div id="chatLine">
                    <input type="text" id="message" placeholder="Send a message" />
                    <button id="send">Send</button>
                </div>
            </div>
        </div>
        <script>
            const fontToggle = document.getElementById("fontToggle");
            fontToggle.addEventListener("change", applyFontToggle);

            function applyFontToggle() {
                const boxes = [document.getElementById("right-panel"), document.getElementById("chat"), document.getElementById("chatMessages"), document.getElementById("message")];
                const textInputs = [document.getElementById("host"), document.getElementById("port"), document.getElementById("slotName"), document.getElementById("password")];
                const buttons = [document.getElementById("connect"), document.getElementById("disconnect"), document.getElementById("send")];
                const font = "dan-ball, monospace";
                const body = document.getElementById("body");

                if (fontToggle.checked) {
                    boxes.forEach((box) => {
                        box.style.fontFamily = font;
                    });
                    buttons.forEach((btn, i) => {
                        btn.style.fontFamily = font;
                        btn.style.fontSize = i === 0 ? "1.2em" : "0.9em"; // connect, disconnect/send
                    });
                    textInputs.forEach((input) => {
                        input.style.fontFamily = font;
                        input.style.fontSize = "1.2em";
                    });
                    body.style.letterSpacing = "0.5px";
                    body.classList.add("font-danball");
                } else {
                    boxes.forEach((box) => {
                        box.style.fontFamily = "monospace";
                        box.style.fontSize = "0.9em";
                    });
                    buttons.forEach((btn, i) => {
                        btn.style.fontFamily = "";
                        btn.style.fontSize = i === 0 ? "1.0em" : "0.8em"; // connect, disconnect/send
                    });
                    textInputs.forEach((input) => {
                        input.style.fontSize = "";
                        input.style.fontFamily = "";
                    });
                    body.style.letterSpacing = "";
                    body.classList.remove("font-danball");
                }
            }

            applyFontToggle();
        </script>
    </body>
</html>
